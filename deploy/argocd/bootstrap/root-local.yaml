# Root Application for the LOCAL kind cluster (P7). Apply once after
# installing Argo CD on kind (see deploy/README.md):
#   kubectl apply -f deploy/argocd/bootstrap/root-local.yaml
# Nothing account-specific here - kind uses no AWS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-local
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/docify-work/docify.git
    targetRevision: main
    path: deploy/argocd/local
    helm:
      releaseName: root-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
