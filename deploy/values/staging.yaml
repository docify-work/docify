# =============================================================================
# Docify STAGING (k3s namespace docify-staging) - overrides for
# deploy/helm/docify/values.yaml. Rendered by the docify-staging Argo CD app.
#
# PUBLIC REPO: no account ids, IPs or secrets here. aws.accountId stays the
# placeholder; the root Argo CD Application injects the real value as a Helm
# parameter at deploy time (see deploy/README.md "Account id injection").
# =============================================================================
env: staging

image:
  # Built as <aws.accountId>.dkr.ecr.ap-south-1.amazonaws.com/docify/backend
  ecrRepository: docify/backend
  # Bumped by release.yml (bot commit) on every merge to main. Do not edit by hand.
  tag: "c48e632de2a19502e466cde50069b947faa0540d"

config:
  PUBLIC_BASE_URL: "https://staging.docify.work"
  EMAIL_FROM: "Docify Staging <no-reply@docify.work>"
  # Filled in P9.4 when the "Docify Staging" GitHub App + Google client exist
  # (ids are not secret).
  GITHUB_APP_ID: "5565791"
  GITHUB_APP_SLUG: "docify-staging-docify-work"
  GITHUB_CLIENT_ID: "Iv23liSV0lfoz9zOw1On"
  GOOGLE_CLIENT_ID: "224400653695-4jugar068188j8ki98ngl064962amhgm.apps.googleusercontent.com"
  # D61: real AI on Amazon Bedrock (Nova + Titan) - paid from AWS credits, IAM allows only Amazon models.
  AI_MODE: real
  AI_PROVIDER: bedrock
  LLM_MODEL_SUMMARY: apac.amazon.nova-micro-v1:0
  LLM_MODEL_DOC: apac.amazon.nova-lite-v1:0
  LLM_MODEL_CHAT: apac.amazon.nova-lite-v1:0
  EMBED_MODEL: amazon.titan-embed-text-v2:0
  # P11: accept synthetic `loadtest` queue messages (simulated work, $0 - no AI/GitHub calls).
  LOADTEST_MESSAGES: "true"

api:
  replicas: 1             # staging: no HPA, one pod (§13.3)
  autoscaling:
    enabled: false
  pdb:
    enabled: false

keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 1          # staging max 1 (memory, §13.4)

ingress:
  className: traefik
  host: origin-staging.docify.work

certificate:
  enabled: true
  # Switch to letsencrypt-prod once a staging-issuer cert works (P9.1).
  issuerName: letsencrypt-prod

# Flip to true in P10 (needs the monitoring app's ServiceMonitor CRD).
serviceMonitor:
  enabled: true

# Read by release.yml to build the SPA's config.json (not by the chart).
frontend:
  env: staging
  githubAppSlug: "docify-staging-docify-work"
  googleEnabled: true
  demoWorkspaceSlug: demo
