# =============================================================================
# Docify EKS LAB (P12, one day, then destroyed - R12).
#
# Same chart, different platform: shows that moving to EKS + RDS is a values
# change, not a rewrite (§24). The lab reuses the STAGING identity (SSM
# params /docify/staging/*, staging GitHub App, DB user/name docify_staging)
# but has its own queue docify-lab-events (shared queue = lab workers would
# drop staging jobs). Install: runbook R12 / infra/terraform/envs/eks-lab.
# Values that contain the account id (queue URLs, RDS host, image registry)
# are passed with --set at install time, never committed.
#
# Differences vs k3s:
#   - DB is RDS PostgreSQL 17 (DATABASE_URL host below), reached via VPC CIDR
#   - AWS credentials come from EKS Pod Identity (agent at 169.254.170.23),
#     not IMDS
#   - ingress = AWS Load Balancer Controller (ALB, plain HTTP on the lab
#     host - one-evening lab, no CloudFront/ACM), not Traefik + cert-manager
#   - the API keeps its origin check: callers send X-Origin-Verify (from SSM)
# =============================================================================
env: staging

image:
  ecrRepository: docify/backend
  # Set to the sha being demoed (normally = current staging tag).
  tag: "0000000000000000000000000000000000000000"

config:
  PUBLIC_BASE_URL: "http://eks-lab.docify.work"
  EMAIL_FROM: "Docify Lab <no-reply@docify.work>"
  EMAIL_BACKEND: console
  AI_MODE: real
  AI_PROVIDER: bedrock
  LLM_MODEL_SUMMARY: apac.amazon.nova-micro-v1:0
  LLM_MODEL_DOC: apac.amazon.nova-lite-v1:0
  LLM_MODEL_CHAT: apac.amazon.nova-lite-v1:0
  EMBED_MODEL: amazon.titan-embed-text-v2:0
  LOADTEST_MESSAGES: "true"
  # SQS_QUEUE_URL / SQS_DLQ_URL: --set from `terraform output` (lab queue)

database:
  # RDS endpoint from `terraform output` of envs/eks-lab (P12.1).
  host: "docify-eks-lab.REPLACE-ME.ap-south-1.rds.amazonaws.com"
  port: 5432

serviceAccount:
  create: true
  name: docify           # Pod Identity association targets this SA

api:
  # Bigger CPU request than k3s so 6 replicas no longer fit on one t4g.medium
  # -> Pending pods -> Cluster Autoscaler adds nodes (P12 AC "node scale-out").
  resources:
    requests: { cpu: 500m, memory: 150Mi }
    limits: { memory: 300Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6        # higher than k3s to force node scale-out (P12 AC)
  pdb:
    enabled: true

keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 3

ingress:
  enabled: true
  className: alb
  host: eks-lab.docify.work
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
  tls:
    enabled: false

certificate:
  enabled: false

networkPolicies:
  enabled: true           # needs VPC CNI network policy support enabled
  # ALB (target-type ip) connects from VPC addresses, not from a namespace.
  ingressSources:
    - ipBlock:
        cidr: 10.20.0.0/16
  postgres:
    external:
      enabled: true
      cidrs:
        - 10.20.0.0/16
  awsCredentialCIDRs:
    - 169.254.170.23/32   # EKS Pod Identity agent
  httpsEgressCIDRs:
    - 0.0.0.0/0

serviceMonitor:
  enabled: false
