# =============================================================================
# External Secrets Operator (chart external-secrets/external-secrets 2.13.0).
# Copies SSM Parameter Store SecureStrings into K8s Secrets (D15) using the
# EC2 instance role (D16). The ClusterSecretStore is in platform-config.
# Budget (§13.4): 3 pods ~100 Mi requests / 200 Mi limits.
# =============================================================================

installCRDs: true

replicaCount: 1
concurrent: 1

# We only use ExternalSecret + ClusterSecretStore. Turning off unused
# reconcilers saves memory and API watches.
processPushSecret: false
processClusterPushSecret: false
processClusterGenerator: false
processClusterExternalSecret: false

resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { memory: 96Mi }

webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 48Mi }

certController:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

serviceMonitor:
  enabled: false
