# =============================================================================
# KEDA (chart kedacore/keda 2.21.0) - scales docify workers 0..N on SQS
# queue length (§5.3, §13.3). The operator calls SQS with the EC2 instance
# role (TriggerAuthentication podIdentity provider aws, identityOwner keda).
# Budget (§13.4): 3 pods ~150 Mi requests / 300 Mi limits.
# =============================================================================

crds:
  install: true

operator:
  replicaCount: 1

metricsServer:
  replicaCount: 1

webhooks:
  enabled: true
  replicaCount: 1

resources:
  operator:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  metricServer:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 96Mi }
  webhooks:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# On k3s there is no IRSA/Pod Identity: the AWS SDK in the operator falls
# back to IMDS (instance role). On EKS (P12) a Pod Identity association on
# the keda-operator service account replaces this - no chart change needed.
podIdentity:
  aws:
    irsa:
      enabled: false

prometheus:
  operator:
    enabled: false
  metricServer:
    enabled: false
