# Grafana admin login from SSM (/docify/shared/grafana/admin_password, §15.2).
# kube-prometheus-stack's Grafana reads Secret "grafana-admin"
# (grafana.admin.existingSecret). Login via port-forward only (R3).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  annotations:
    # Must exist before the Grafana Deployment starts.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /docify/shared/grafana/admin_password
