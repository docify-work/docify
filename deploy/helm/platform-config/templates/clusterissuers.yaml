{{- if .Values.clusterIssuers.enabled }}
{{- range $name, $iss := .Values.clusterIssuers.issuers }}
---
# Let's Encrypt via DNS-01 on Route 53 (D08, §13.5). HTTP-01 is impossible:
# the origin only accepts HTTPS from CloudFront. cert-manager uses ambient
# credentials (EC2 instance role via IMDS) - no keys anywhere. The IAM
# policy only allows _acme-challenge records for the two origin names.
# Use letsencrypt-staging first (untrusted certs, generous rate limits).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: {{ $iss.server }}
    email: {{ $.Values.clusterIssuers.email | quote }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - selector:
          dnsZones:
            - {{ $.Values.domain | quote }}
        dns01:
          route53:
            region: {{ $.Values.aws.region }}
            # Required: the instance role may not list hosted zones.
            hostedZoneID: {{ $.Values.aws.hostedZoneId | quote }}
{{- end }}
{{- end }}
