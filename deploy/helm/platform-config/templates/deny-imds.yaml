{{- range .Values.denyImds.namespaces }}
---
# deny-imds for {{ . }} (D16): pods here may talk to anything EXCEPT the EC2
# metadata endpoint, so they can't borrow the instance role.
# Two egress rules because "ipBlock" is meant for off-cluster IPs; whether it
# also matches pod IPs depends on the CNI - the namespaceSelector rule keeps
# in-cluster traffic working either way.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-imds
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ $.Values.denyImds.imdsCIDR }}
    - to:
        - namespaceSelector: {}
{{- end }}
