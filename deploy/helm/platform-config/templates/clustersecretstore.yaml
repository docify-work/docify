{{- if .Values.clusterSecretStore.enabled }}
# One store for the whole cluster: SSM Parameter Store in ap-south-1 (D15).
# No auth block = AWS SDK default credential chain = EC2 instance role via
# IMDS (D16). ExternalSecrets in docify-*, data and monitoring reference it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.aws.region }}
{{- end }}
