{{- include "data.validateEnvs" . }}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.localSecrets.enabled }}
{{- fail "externalSecrets.enabled and localSecrets.enabled are mutually exclusive" }}
{{- end }}
# postgres-passwords: superuser password + one password per env DB role,
# copied from SSM by External Secrets Operator (§5.5). Wave -2: before the
# StatefulSet (0) and the db-bootstrap hook (1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-passwords
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: postgres-passwords
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.superuserPasswordKey }}
    {{- range .Values.envs }}
    - secretKey: {{ include "data.envPasswordVar" . }}
      remoteRef:
        key: /docify/{{ . }}/db/password
    {{- end }}
{{- else if .Values.localSecrets.enabled }}
# DEV ONLY (kind): same Secret, from values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-passwords
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "localSecrets.superuserPassword is required" .Values.localSecrets.superuserPassword | quote }}
  {{- range .Values.envs }}
  {{ include "data.envPasswordVar" . }}: {{ required (printf "localSecrets.envPasswords.%s is required" .) (get $.Values.localSecrets.envPasswords .) | quote }}
  {{- end }}
{{- else }}
{{- fail "enable externalSecrets or localSecrets: Postgres needs the postgres-passwords Secret" }}
{{- end }}
