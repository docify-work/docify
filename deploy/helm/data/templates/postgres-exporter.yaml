{{- if .Values.exporter.enabled }}
# P13.2: postgres-exporter. Labelled postgres-client=true, so the namespace's
# NetworkPolicies already let it reach Postgres + DNS (and nothing else). It
# connects as the superuser over the in-cluster Service with sslmode=disable
# (same trust boundary as pg-backup); read-only queries only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    {{- include "data.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        docify.work/postgres-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: exporter
          image: {{ .Values.exporter.image }}
          args: ["--no-collector.stat_bgwriter"]
          env:
            - name: DATA_SOURCE_URI
              value: "postgres.{{ .Release.Namespace }}.svc:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: postgres
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: { name: postgres-passwords, key: POSTGRES_PASSWORD }
          ports:
            - { name: metrics, containerPort: 9187 }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          securityContext:
            {{- include "data.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    {{- include "data.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - { name: metrics, port: 9187, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics
      interval: 60s
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-exporter-scrape
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.exporter.monitoringNamespace }}
      ports:
        - { protocol: TCP, port: 9187 }
{{- end }}
{{- end }}
