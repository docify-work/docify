# worker: long-polls SQS and runs jobs (§5.3). No HTTP port except :9000
# metrics. KEDA scales it 0..N on queue length (incl. in-flight messages).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "docify.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  # (replicas omitted when KEDA owns it - see deploy-api.yaml for why)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "docify.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "docify.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
        {{- include "docify.netLabels.app" . | nindent 8 }}
        {{- include "docify.netLabels.aws" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "docify.podCommon" . | nindent 6 }}
      # SIGTERM -> stop receiving, finish in-flight jobs for <=120 s, then
      # release leases (§5.3). 150 s leaves headroom; node shutdown grace is
      # 180 s (§12.4).
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "docify.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.worker.command }}
          ports:
            - name: metrics
              containerPort: 9000
              protocol: TCP
          {{- include "docify.envFrom" . | nindent 10 }}
          # Heartbeat-file liveness: the worker loop touches the file at least
          # every 30 s; if it is older than 2 min the loop is stuck -> restart.
          # `find -mmin -N` prints the file only if modified < N minutes ago.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -n "$(find {{ .Values.worker.heartbeatFile }} -mmin -{{ .Values.worker.heartbeatMaxAgeMinutes }} 2>/dev/null)"
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -n "$(find {{ .Values.worker.heartbeatFile }} -mmin -{{ .Values.worker.heartbeatMaxAgeMinutes }} 2>/dev/null)"
            periodSeconds: 30
            failureThreshold: 2
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "docify.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "docify.tmpVolume" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
