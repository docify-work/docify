{{- if .Values.serviceAccount.create }}
# One SA for all backend pods. Tokens are not mounted (pods don't call the
# Kubernetes API); on EKS, Pod Identity binds an IAM role to this name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docify.serviceAccountName" . }}
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
