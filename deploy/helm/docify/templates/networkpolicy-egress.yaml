{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
# "app" role: Valkey in this namespace + Postgres (in-cluster or RDS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      {{- include "docify.netLabels.app" . | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    {{- if .Values.valkey.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "docify.selectorLabels" (dict "ctx" . "component" "valkey") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 6379 }
    {{- end }}
    {{- if and $np.postgres.external.enabled (not $np.postgres.external.cidrs) }}
    {{- fail "networkPolicies.postgres.external.cidrs must not be empty" }}
    {{- end }}
    - to:
        {{- if $np.postgres.external.enabled }}
        {{- range $np.postgres.external.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.postgres.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.postgres.podLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.database.port }} }
    {{- if .Values.devServices.elasticmq.enabled }}
    # DEV: local SQS (ElasticMQ) in this namespace.
    - to:
        - podSelector:
            matchLabels:
              {{- include "docify.selectorLabels" (dict "ctx" . "component" "elasticmq") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9324 }
    {{- end }}
    {{- if .Values.devServices.mailpit.enabled }}
    # DEV: local SMTP (Mailpit) in this namespace.
    - to:
        - podSelector:
            matchLabels:
              {{- include "docify.selectorLabels" (dict "ctx" . "component" "mailpit") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 1025 }
    {{- end }}
---
# "aws" role: AWS credential endpoint (IMDS, D16) + HTTPS to the internet
# (AWS APIs, GitHub, Anthropic, Voyage). Only api, worker and reconcile get
# this label; Valkey, migrate and housekeeping cannot reach IMDS at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-egress
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      {{- include "docify.netLabels.aws" . | nindent 6 }}
  policyTypes: ["Egress"]
  {{- /* An empty "to:" would mean "any destination" - only render non-empty rules. */}}
  {{- if or $np.awsCredentialCIDRs $np.httpsEgressCIDRs }}
  egress:
    {{- with $np.awsCredentialCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 80 }
    {{- end }}
    {{- with $np.httpsEgressCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
