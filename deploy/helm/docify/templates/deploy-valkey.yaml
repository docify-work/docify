{{- if .Values.valkey.enabled }}
# Valkey (Redis-compatible) per env: rate limits + caches only (D04, §5.5).
# Ephemeral by design: no persistence, LRU eviction at maxmemory. Losing it
# only resets rate-limit windows and caches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    {{- include "docify.componentLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate: there is no state to hand over and only one instance may run.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "docify.selectorLabels" (dict "ctx" . "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docify.selectorLabels" (dict "ctx" . "component" "valkey") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's "valkey" user is uid 999 / gid 1000.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          args:
            - valkey-server
            # No RDB snapshots / AOF: pure cache.
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.valkey.maxmemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
            # No password: access is limited to this namespace by NetworkPolicy.
            - --protected-mode
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    {{- include "docify.componentLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "docify.selectorLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
{{- end }}
