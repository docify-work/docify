{{- if .Values.localSecrets.enabled }}
{{- if .Values.externalSecrets.enabled }}
{{- fail "localSecrets.enabled and externalSecrets.enabled are mutually exclusive" }}
{{- end }}
# DEV ONLY (kind): the same two Secrets ESO would create, rendered from values.
# Never enable in staging/prod - values files are in a public repo.
apiVersion: v1
kind: Secret
metadata:
  name: docify-app
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  {{- range $k := keys .Values.externalSecrets.appKeys | sortAlpha }}
  {{ $k }}: {{ get $.Values.localSecrets.app $k | default "" | toString | quote }}
  {{- end }}
  {{- range $k, $v := .Values.localSecrets.app }}
  {{- if not (hasKey $.Values.externalSecrets.appKeys $k) }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: docify-db
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  {{- if .Values.localSecrets.databaseUrl }}
  DATABASE_URL: {{ .Values.localSecrets.databaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%v/%s" (include "docify.dbUser" .) (urlquery .Values.localSecrets.dbPassword) .Values.database.host .Values.database.port (include "docify.dbName" .) | quote }}
  {{- end }}
{{- end }}
