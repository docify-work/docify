{{- if .Values.externalSecrets.enabled }}
# docify-app: application secrets copied from SSM Parameter Store
# (/docify/<env>/..., §15.2) by External Secrets Operator. Wave -2: must exist
# before the migrate hook (-1) and the pods (0). Rotation: runbook R6.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docify-app
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # The CRD may not exist yet on a fresh cluster (ESO app syncs at -5).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: docify-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- $prefix := include "docify.ssmPrefix" . }}
    {{- range $envVar, $path := .Values.externalSecrets.appKeys }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ printf "%s/%s" $prefix $path }}
    {{- end }}
{{- end }}
