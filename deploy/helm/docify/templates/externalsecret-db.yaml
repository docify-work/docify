{{- if .Values.externalSecrets.enabled }}
# docify-db: builds DATABASE_URL from the env's DB password in SSM (§5.5).
# The {{ "{{ .password }}" }} below is an ESO template expression (escaped for Helm).
# urlquery protects the URL if the password contains reserved characters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docify-db
  labels:
    {{- include "docify.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: docify-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: {{ printf "postgresql+asyncpg://%s:{{ .password | urlquery }}@%s:%v/%s" (include "docify.dbUser" .) .Values.database.host .Values.database.port (include "docify.dbName" .) | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/%s" (include "docify.ssmPrefix" .) .Values.externalSecrets.dbPasswordKey }}
{{- end }}
