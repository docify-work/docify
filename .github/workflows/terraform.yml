# Terraform plan + apply for infra/terraform/envs/main (Master Doc §14.2).
#
# Runs on every push to main that touches infra/** (or by hand). The job uses
# the GitHub Environment "infra" (required reviewer = Ganesh), so nothing is
# applied without an approval click; the OIDC role docify-ci-infra trusts ONLY
# that environment (sub = repo:docify-work@<id>/docify@<id>:environment:infra, immutable subject).
#
# bootstrap/ is NOT applied here - it has local state and is run by the admin.
#
# Guard: does nothing until the repo variable AWS_ENABLED == 'true'
# (see infra/README.md -> "GitHub settings").
name: terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "lambdas/webhook_ingest/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-envs-main
  cancel-in-progress: false # never kill an apply half-way

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    name: plan + apply (envs/main)
    if: vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infra
    permissions:
      contents: read
      id-token: write # OIDC -> docify-ci-infra
    defaults:
      run:
        working-directory: infra/terraform/envs/main
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN || 'docify.work' }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE || 't4g.large' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (OIDC, docify-ci-infra)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/docify-ci-infra
          role-session-name: gha-terraform-${{ github.run_id }}
          mask-aws-account-id: true

      - name: terraform init
        run: terraform init -no-color -backend-config="bucket=docify-tfstate-${AWS_ACCOUNT_ID}"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan
          # Short summary (resource counts only) for the run page.
          terraform show -json tfplan | jq -r '
            [.resource_changes[]?.change.actions | join(",")] as $a
            | "### Terraform plan (envs/main)\n\n| action | count |\n| --- | --- |\n"
              + "| create | \([$a[] | select(. == "create")] | length) |\n"
              + "| update | \([$a[] | select(. == "update")] | length) |\n"
              + "| replace | \([$a[] | select(. == "delete,create" or . == "create,delete")] | length) |\n"
              + "| delete | \([$a[] | select(. == "delete")] | length) |"
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=5m -auto-approve tfplan
