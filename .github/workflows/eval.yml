# AI evaluation against STAGING (Master Doc §11.7, §14.2). Manual only: it
# costs real LLM/embedding money.
#
# Runs `docify eval` INSIDE the staging api pod via SSM Run Command, so the
# eval uses staging's own config + secrets (nothing secret enters GitHub).
# The server must be running (use start.yml first).
# Guard: AWS_ENABLED repo variable. Role docify-ops-power (main only).
name: eval

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run in the staging api pod"
        required: false
        default: "docify eval"

permissions: {}

concurrency:
  group: eval-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  SERVER_NAME_TAG: docify-server
  NAMESPACE: docify-staging
  DEPLOYMENT: api

jobs:
  eval:
    name: docify eval (staging)
    if: vars.AWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC -> docify-ops-power
    steps:
      - name: AWS credentials (OIDC, docify-ops-power)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/docify-ops-power
          role-session-name: gha-eval-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Require a running server
        id: server
        run: |
          id="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${SERVER_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text | head -n 1)"
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::error::Server is not running - run the 'start' workflow first"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run eval in the staging api pod
        env:
          ID: ${{ steps.server.outputs.id }}
          EVAL_COMMAND: ${{ inputs.command }}
        run: |
          # Only allow "docify eval ..." style commands (input is user-provided).
          if ! [[ "$EVAL_COMMAND" =~ ^docify\ eval([\ a-zA-Z0-9_=.-]*)$ ]]; then
            echo "::error::command must start with 'docify eval' and contain only simple flags"
            exit 1
          fi
          jq -n --arg ns "$NAMESPACE" --arg dep "$DEPLOYMENT" --arg cmd "$EVAL_COMMAND" '{
            commands: [
              "set -eu",
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              ("kubectl -n " + $ns + " exec deploy/" + $dep + " -- " + $cmd)
            ],
            executionTimeout: ["2400"]
          }' > params.json

          cmd_id="$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript \
            --comment "docify eval" --parameters file://params.json \
            --query Command.CommandId --output text)"
          echo "SSM command $cmd_id"

          status=Pending
          for _ in $(seq 1 250); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending | InProgress | Delayed) continue ;;
              *) break ;;
            esac
          done

          # SSM keeps the first 24,000 characters of output - plenty for the report.
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$ID" \
            --query StandardOutputContent --output text | tee eval-output.txt
          {
            echo "### docify eval (staging)"
            echo
            echo '```'
            cat eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$ID" \
              --query StandardErrorContent --output text || true
            echo "::error::eval finished with status $status"
            exit 1
          fi
