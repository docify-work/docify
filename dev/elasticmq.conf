# Local SQS (ElasticMQ). Mirrors the AWS queues in Master Doc §8.5.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  docify-local-events {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "docify-local-events-dlq"
      maxReceiveCount = 5
    }
  }
  docify-local-events-dlq {}
  docify-test-events {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue {
      name = "docify-test-events-dlq"
      maxReceiveCount = 5
    }
  }
  docify-test-events-dlq {}
}
