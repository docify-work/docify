# Used for local commands like `uv run alembic revision --autogenerate -m "..."`.
# In containers, `docify migrate` builds the same config programmatically.
[alembic]
script_location = %(here)s/src/docify/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
