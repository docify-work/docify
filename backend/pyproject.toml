[project]
name = "docify"
version = "0.1.0"
description = "Docify backend: API, worker, jobs, AI and GitHub integration"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "pgvector>=0.4",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "email-validator>=2.3",
    "httpx>=0.28",
    "boto3>=1.40",
    "pyjwt[crypto]>=2.10",
    "pwdlib[argon2]>=0.3",
    "anthropic>=0.75",
    "structlog>=25.4",
    "prometheus-client>=0.23",
    "redis>=6.4",
    "pathspec>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
docify = "docify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-pyyaml",
    "boto3-stubs[sqs,s3,sesv2]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docify"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/docify/demo/eval_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
ignore = ["S101", "S105", "S106", "B008", "RUF001", "RUF002", "RUF003", "S311", "ASYNC230", "ASYNC240", "UP047", "PT018", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017", "E501", "RUF012"]
"src/docify/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["src/docify/db/migrations/", "src/docify/demo/eval_data/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres/Valkey/ElasticMQ (docker compose up)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["docify"]
omit = ["*/migrations/*"]
